name: PA Listener

# Keeps buttons + slash-commands responsive in near real-time.
# Each run listens ~5h then re-arms itself, so the bot is effectively always on.
# (Use a PUBLIC repo so Actions minutes are unlimited & free.)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # daily watchdog so it self-heals if a chain ever breaks

concurrency:
  group: pa-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Listen for commands & buttons
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID:          ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON:    ${{ secrets.GOOGLE_SA_JSON }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_KEY: ${{ secrets.GH_MODELS_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          TOGETHER_API_KEY:  ${{ secrets.TOGETHER_API_KEY }}
        run: python pa_bot.py listen
      - name: Re-arm the listener
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/listener.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
