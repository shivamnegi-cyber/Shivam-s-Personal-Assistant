name: PA Listener

# TRUE 24/7 — GitHub's scheduler starts a fresh listener every 15 minutes.
# Each run polls Telegram for ~13 min then exits; the next run is already scheduled,
# so the bot can never "die" (no self-relaunch, no reliance on the blocked GITHUB_TOKEN).
# Frequent cycles + cached deps keep the handover gap under ~1 min, so replies feel instant.
# The Telegram offset is saved to the sheet, so no message is lost across the handover.
# Use a PUBLIC repo so Actions minutes are unlimited & free.

on:
  workflow_dispatch:          # lets you start it instantly the first time
  schedule:
    - cron: "*/15 * * * *"    # every 15 minutes, forever

concurrency:
  group: pa-listener
  cancel-in-progress: false   # never kill a run that's mid-poll; the next just waits its turn

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"        # cache deps so cold-start is ~10s, not ~40s
      - run: pip install -r requirements.txt
      - name: Listen for commands & buttons (~13 min)
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID:          ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON:    ${{ secrets.GOOGLE_SA_JSON }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          GH_MODELS_KEY:     ${{ secrets.GH_MODELS_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          TOGETHER_API_KEY:  ${{ secrets.TOGETHER_API_KEY }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
        run: python pa_bot.py listen
