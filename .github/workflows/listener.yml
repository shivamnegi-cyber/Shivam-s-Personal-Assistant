name: PA Listener

# PINTEREST-STYLE 24/7 — one long continuous run (~5.7h) that relaunches ITSELF at the end
# via a Personal Access Token (PAT_DISPATCH). No time-based cron, no gaps: the bot long-polls
# Telegram the whole time (instant replies) and hands off instantly to the next run.
# The relaunch uses a PAT (not the built-in GITHUB_TOKEN, which GitHub blocks from starting runs).
# Requires a repo secret PAT_DISPATCH = a PAT with Actions: read/write on this repo.
# Use a PUBLIC repo so Actions minutes are unlimited & free.

on:
  workflow_dispatch:          # start it once; it keeps itself alive after that
  schedule:
    - cron: "0 3 * * *"       # daily safety-net: heals the chain if the self-relaunch ever fails

concurrency:
  group: pa-listener
  cancel-in-progress: false   # GitHub keeps only ONE pending run, so the daily trigger never
                              # stacks up next to the self-relaunch — no duplicate listeners

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Listen (continuous ~5.7h)
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID:          ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON:    ${{ secrets.GOOGLE_SA_JSON }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          GH_MODELS_KEY:     ${{ secrets.GH_MODELS_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          TOGETHER_API_KEY:  ${{ secrets.TOGETHER_API_KEY }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
        run: python pa_bot.py listen
      - name: Relaunch itself (keeps the chain unbroken)
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_DISPATCH }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/listener.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
